apiVersion: apps/v1
kind: Deployment

metadata:
  name: multi-env-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: multi-env-app

  template:

    metadata:
      labels:
        app: multi-env-app

    spec:

      containers:

      - name: app

        image: 581049838698.dkr.ecr.us-east-1.amazonaws.com/multi-env-platform-app:v1

        ports:
        - containerPort: 80

        envFrom:

        - configMapRef:
            name: app-config

        - secretRef:
            name: app-secret
